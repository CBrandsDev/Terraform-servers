---
- name: Configurar o Master Node (Control Plane)
  hosts: master
  become: yes # Executa tudo como sudo
  tasks:
    - name: Instalar K3s no Master
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Capturar o token de registro do cluster
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token

    - name: Guardar o token em uma variavel global
      set_fact:
        k3s_token: "{{ node_token['content'] | b64decode | trim }}"

- name: Configurar os Worker Nodes
  hosts: workers
  become: yes
  tasks:
    - name: Instalar K3s e registrar no cluster
      shell: |
        curl -sfL https://get.k3s.io | K3S_URL=https://192.168.1.210:6443 K3S_TOKEN={{ hostvars[groups['master'][0]]['k3s_token'] }} sh -
      args:
        creates: /usr/local/bin/k3s
